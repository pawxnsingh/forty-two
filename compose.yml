name: forty-two

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forty_two}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forty_two}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  database-migrate:
    image: forty-two-data-source-mcp:local
    build:
      context: .
      dockerfile: apps/data-source-mcp/Dockerfile
    command: ["pnpm", "--filter", "@forty-two/db", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-forty_two}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-forty_two}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-readonly-init:
    image: postgres:17-alpine
    command:
      [
        "psql",
        "--host=postgres",
        "--username=${POSTGRES_USER:-forty_two}",
        "--dbname=${POSTGRES_DB:-forty_two}",
        "--file=/opt/forty-two/init-readonly-postgres.sql",
        "--set=ON_ERROR_STOP=1",
        "--set=owner_user=${POSTGRES_USER:-forty_two}",
        "--set=reader_user=forty_two_reader",
        "--set=reader_password=${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}",
        "--set=writer_user=forty_two_writer",
        "--set=writer_password=${POSTGRES_WRITER_PASSWORD:?Set POSTGRES_WRITER_PASSWORD in .env}",
        "--set=mutation_user=forty_two_mutation",
        "--set=mutation_password=${POSTGRES_MUTATION_PASSWORD:?Set POSTGRES_MUTATION_PASSWORD in .env}",
        "--set=mcp_user=forty_two_mcp",
        "--set=mcp_password=${POSTGRES_MCP_PASSWORD:?Set POSTGRES_MCP_PASSWORD in .env}",
      ]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./scripts/init-readonly-postgres.sql:/opt/forty-two/init-readonly-postgres.sql:ro
    depends_on:
      database-migrate:
        condition: service_completed_successfully
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_READER_PASSWORD: ${MYSQL_READER_PASSWORD:?Set MYSQL_READER_PASSWORD in .env}
      MYSQL_WRITER_PASSWORD: ${MYSQL_WRITER_PASSWORD:?Set MYSQL_WRITER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mysql-demo-init:
    image: mysql:8.4
    command: ["sh", "/opt/forty-two/init-mysql-demo.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_READER_PASSWORD: ${MYSQL_READER_PASSWORD:?Set MYSQL_READER_PASSWORD in .env}
      MYSQL_WRITER_PASSWORD: ${MYSQL_WRITER_PASSWORD:?Set MYSQL_WRITER_PASSWORD in .env}
    volumes:
      - ./scripts/init-mysql-demo.sh:/opt/forty-two/init-mysql-demo.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  sqlserver-demo-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    command: ["bash", "/opt/forty-two/init-sqlserver-demo.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD in .env}
      SQLSERVER_READER_PASSWORD: ${SQLSERVER_READER_PASSWORD:?Set SQLSERVER_READER_PASSWORD in .env}
      SQLSERVER_WRITER_PASSWORD: ${SQLSERVER_WRITER_PASSWORD:?Set SQLSERVER_WRITER_PASSWORD in .env}
    volumes:
      - ./scripts/init-sqlserver-demo.sh:/opt/forty-two/init-sqlserver-demo.sh:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  data-source-mcp:
    image: forty-two-data-source-mcp:local
    build:
      context: .
      dockerfile: apps/data-source-mcp/Dockerfile
    dns:
      - ${FORTY_TWO_DNS_SERVER:-1.1.1.1}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8791
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      SHUTDOWN_TIMEOUT_MS: ${DATA_SOURCE_MCP_SHUTDOWN_TIMEOUT_MS:-15000}
      MCP_CONTROL_DATABASE_URL: postgresql://forty_two_mcp:${POSTGRES_MCP_PASSWORD:?Set POSTGRES_MCP_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-forty_two}
      DATA_SOURCE_CREDENTIALS_ENCRYPTION_KEY: ${DATA_SOURCE_CREDENTIALS_ENCRYPTION_KEY:?Set DATA_SOURCE_CREDENTIALS_ENCRYPTION_KEY in .env}
      SQL_CHANGE_MAX_ROWS: ${SQL_CHANGE_MAX_ROWS:-100}
      SQL_CHANGE_MAX_BIGQUERY_BYTES_BILLED: ${SQL_CHANGE_MAX_BIGQUERY_BYTES_BILLED:-1000000000}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:?Set AZURE_STORAGE_ACCOUNT_NAME in .env}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:?Set AZURE_STORAGE_ACCOUNT_KEY in .env}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:?Set AZURE_STORAGE_CONTAINER in .env}
    depends_on:
      postgres-readonly-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8791/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 25s
    restart: unless-stopped

  todo-mcp:
    image: forty-two-todo-mcp:local
    build:
      context: .
      dockerfile: apps/todo-mcp/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8792
      DATABASE_URL: postgresql://${POSTGRES_USER:-forty_two}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-forty_two}
      TODO_MCP_AUTH_TOKEN: ${TODO_MCP_AUTH_TOKEN:?Set TODO_MCP_AUTH_TOKEN in .env}
    depends_on:
      database-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8792/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 20s
    restart: unless-stopped

  sandbox-image:
    image: ${FORTY_TWO_SANDBOX_LOCAL_IMAGE:-forty-two-sandbox:local}
    profiles: ["sandbox-image"]
    build:
      context: .
      dockerfile: docker/sandbox/Dockerfile

  trueforge:
    image: forty-two-trueforge:local
    build:
      context: .
      dockerfile: docker/trueforge/Dockerfile
      args:
        PLATFORM_SANDBOX_IMAGE_URI: ${PLATFORM_SANDBOX_IMAGE_URI:?Set PLATFORM_SANDBOX_IMAGE_URI to the published immutable sandbox image digest}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8790
      PUBLIC_BASE_URL: http://trueforge:8790
      STANDALONE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-forty_two}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forty_two}
      REDIS_URL: redis://redis:6379
    dns:
      - ${FORTY_TWO_DNS_SERVER:-1.1.1.1}
    depends_on:
      data-source-mcp:
        condition: service_healthy
      todo-mcp:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped

  trueforge-bootstrap:
    image: node:24-alpine
    command: ["node", "/opt/forty-two/bootstrap-trueforge.mjs"]
    environment:
      TRUEFORGE_INTERNAL_URL: http://trueforge:8790
      DATA_SOURCE_MCP_INTERNAL_URL: http://data-source-mcp:8791
      TODO_MCP_INTERNAL_URL: http://todo-mcp:8792
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:?Set DAYTONA_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      TODO_MCP_AUTH_TOKEN: ${TODO_MCP_AUTH_TOKEN:?Set TODO_MCP_AUTH_TOKEN in .env}
      FORTY_TWO_AGENT_NAME: ${FORTY_TWO_AGENT_NAME:-forty-two-data-agent}
      FORTY_TWO_AGENT_SPEC_PATH: /opt/forty-two/agents/forty-two-data-agent.json
    volumes:
      - ./scripts/bootstrap-trueforge.mjs:/opt/forty-two/bootstrap-trueforge.mjs:ro
      - ./config/agents:/opt/forty-two/agents:ro
    depends_on:
      data-source-mcp:
        condition: service_healthy
      todo-mcp:
        condition: service_healthy
      trueforge:
        condition: service_healthy
    restart: "no"

  web:
    image: forty-two-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command:
      [
        "sh",
        "-c",
        "pnpm install --prefer-offline --frozen-lockfile && exec pnpm --filter web exec next dev --hostname 0.0.0.0 --port 3000",
      ]
    dns:
      - ${FORTY_TWO_DNS_SERVER:-1.1.1.1}
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-forty_two}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-forty_two}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}
      POSTGRES_WRITER_PASSWORD: ${POSTGRES_WRITER_PASSWORD:?Set POSTGRES_WRITER_PASSWORD in .env}
      POSTGRES_MUTATION_PASSWORD: ${POSTGRES_MUTATION_PASSWORD:?Set POSTGRES_MUTATION_PASSWORD in .env}
      MYSQL_READER_PASSWORD: ${MYSQL_READER_PASSWORD:?Set MYSQL_READER_PASSWORD in .env}
      MYSQL_WRITER_PASSWORD: ${MYSQL_WRITER_PASSWORD:?Set MYSQL_WRITER_PASSWORD in .env}
      SQLSERVER_READER_PASSWORD: ${SQLSERVER_READER_PASSWORD:?Set SQLSERVER_READER_PASSWORD in .env}
      SQLSERVER_WRITER_PASSWORD: ${SQLSERVER_WRITER_PASSWORD:?Set SQLSERVER_WRITER_PASSWORD in .env}
      TRUEFORGE_INTERNAL_URL: http://trueforge:8790
      FORTY_TWO_AGENT_NAME: ${FORTY_TWO_AGENT_NAME:-forty-two-data-agent}
      MCP_CAPABILITY_SIGNING_KEY: ${MCP_CAPABILITY_SIGNING_KEY:?Set MCP_CAPABILITY_SIGNING_KEY in .env}
      MCP_CAPABILITY_TTL_SECONDS: ${MCP_CAPABILITY_TTL_SECONDS:-3600}
      CHAT_SESSION_MAX_DATA_SOURCES: ${CHAT_SESSION_MAX_DATA_SOURCES:-8}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:?Set DAYTONA_API_KEY in .env}
      AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT_NAME:?Set AZURE_STORAGE_ACCOUNT_NAME in .env}
      AZURE_STORAGE_ACCOUNT_KEY: ${AZURE_STORAGE_ACCOUNT_KEY:?Set AZURE_STORAGE_ACCOUNT_KEY in .env}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:?Set AZURE_STORAGE_CONTAINER in .env}
      AZURE_STORAGE_ALLOWED_ORIGINS: ${AZURE_STORAGE_ALLOWED_ORIGINS:-http://localhost:3000}
      DATA_SOURCE_MAX_FILE_SIZE_BYTES: ${DATA_SOURCE_MAX_FILE_SIZE_BYTES:-26214400}
      AZURE_STORAGE_UPLOAD_SAS_TTL_SECONDS: ${AZURE_STORAGE_UPLOAD_SAS_TTL_SECONDS:-300}
      DATA_SOURCE_MCP_INTERNAL_URL: http://data-source-mcp:8791
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      TODO_MCP_AUTH_TOKEN: ${TODO_MCP_AUTH_TOKEN:?Set TODO_MCP_AUTH_TOKEN in .env}
      DATA_SOURCE_CREDENTIALS_ENCRYPTION_KEY: ${DATA_SOURCE_CREDENTIALS_ENCRYPTION_KEY:?Set DATA_SOURCE_CREDENTIALS_ENCRYPTION_KEY in .env}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_pnpm_store:/pnpm/store
      - web_next_cache:/workspace/apps/web/.next
    depends_on:
      mysql-demo-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      sqlserver-demo-init:
        condition: service_completed_successfully
      trueforge-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
  sqlserver_data:
  redis_data:
  web_node_modules:
  web_pnpm_store:
  web_next_cache:
