name: forty-two

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forty_two}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forty_two}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres-readonly-init:
    image: postgres:17-alpine
    command:
      [
        "psql",
        "--host=postgres",
        "--username=${POSTGRES_USER:-forty_two}",
        "--dbname=${POSTGRES_DB:-forty_two}",
        "--file=/opt/forty-two/init-readonly-postgres.sql",
        "--set=ON_ERROR_STOP=1",
        "--set=owner_user=${POSTGRES_USER:-forty_two}",
        "--set=reader_user=forty_two_reader",
        "--set=reader_password=${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}",
      ]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./scripts/init-readonly-postgres.sql:/opt/forty-two/init-readonly-postgres.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  data-source-mcp:
    image: forty-two-data-source-mcp:local
    build:
      context: .
      dockerfile: apps/data-source-mcp/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8791
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-}"
      SHUTDOWN_TIMEOUT_MS: ${DATA_SOURCE_MCP_SHUTDOWN_TIMEOUT_MS:-15000}
      DATA_SOURCE_CONNECTIONS_JSON: "${DATA_SOURCE_CONNECTIONS_JSON:-}"
      PLATFORM_POSTGRES_HOST: postgres
      PLATFORM_POSTGRES_PORT: 5432
      PLATFORM_POSTGRES_USER: forty_two_reader
      PLATFORM_POSTGRES_PASSWORD: ${POSTGRES_READER_PASSWORD:?Set POSTGRES_READER_PASSWORD in .env}
      PLATFORM_POSTGRES_DATABASE: ${POSTGRES_DB:-forty_two}
    ports:
      - "127.0.0.1:${DATA_SOURCE_MCP_PORT:-8791}:8791"
    depends_on:
      postgres-readonly-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8791/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 25s
    restart: unless-stopped

  trueforge:
    image: forty-two-trueforge:local
    build:
      context: ./vendor/trueforge
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8790
      PUBLIC_BASE_URL: ${TRUEFORGE_PUBLIC_BASE_URL:-http://localhost:8790}
      STANDALONE: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-forty_two}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forty_two}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${TRUEFORGE_PORT:-8790}:8790"
    depends_on:
      data-source-mcp:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8790/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 35s
    restart: unless-stopped

  trueforge-bootstrap:
    image: node:24-alpine
    command: ["node", "/opt/forty-two/bootstrap-trueforge.mjs"]
    environment:
      TRUEFORGE_INTERNAL_URL: http://trueforge:8790
      DATA_SOURCE_MCP_INTERNAL_URL: http://data-source-mcp:8791
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:?Set DAYTONA_API_KEY in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN in .env}
      FORTY_TWO_AGENT_NAME: ${FORTY_TWO_AGENT_NAME:-forty-two-data-agent}
      FORTY_TWO_AGENT_SPEC_PATH: /opt/forty-two/agents/forty-two-data-agent.json
    volumes:
      - ./scripts/bootstrap-trueforge.mjs:/opt/forty-two/bootstrap-trueforge.mjs:ro
      - ./config/agents:/opt/forty-two/agents:ro
    depends_on:
      data-source-mcp:
        condition: service_healthy
      trueforge:
        condition: service_healthy
    restart: "no"

  web:
    image: forty-two-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    command:
      [
        "sh",
        "-c",
        "pnpm install --prefer-offline --frozen-lockfile && exec pnpm --filter web exec next dev --hostname 0.0.0.0 --port 3000",
      ]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-forty_two}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-forty_two}
      TRUEFORGE_INTERNAL_URL: http://trueforge:8790
      NEXT_PUBLIC_TRUEFORGE_URL: ${TRUEFORGE_PUBLIC_BASE_URL:-http://localhost:8790}
      FORTY_TWO_AGENT_NAME: ${FORTY_TWO_AGENT_NAME:-forty-two-data-agent}
      DAYTONA_API_URL: ${DAYTONA_API_URL:-https://app.daytona.io/api}
      DAYTONA_API_KEY: ${DAYTONA_API_KEY:?Set DAYTONA_API_KEY in .env}
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_pnpm_store:/pnpm/store
      - web_next_cache:/workspace/apps/web/.next
    depends_on:
      postgres:
        condition: service_healthy
      trueforge-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  web_pnpm_store:
  web_next_cache:
